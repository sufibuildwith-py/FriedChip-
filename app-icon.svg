<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c212c"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="silverTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Base Carrier / Substrate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#262c3b" stroke-width="4"/>

  <!-- Package Pins (4 per side) -->
  <!-- Top Pins -->
  <rect x="156" y="44" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="212" y="44" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="268" y="44" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="324" y="44" width="28" height="48" rx="6" fill="#333b4f"/>

  <!-- Bottom Pins -->
  <rect x="156" y="420" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="212" y="420" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="268" y="420" width="28" height="48" rx="6" fill="#333b4f"/>
  <rect x="324" y="420" width="28" height="48" rx="6" fill="#333b4f"/>

  <!-- Left Pins -->
  <rect x="44" y="156" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="44" y="212" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="44" y="268" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="44" y="324" width="48" height="28" rx="6" fill="#333b4f"/>

  <!-- Right Pins -->
  <rect x="420" y="156" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="420" y="212" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="420" y="268" width="48" height="28" rx="6" fill="#333b4f"/>
  <rect x="420" y="324" width="48" height="28" rx="6" fill="#333b4f"/>

  <!-- Silicon Package Body -->
  <rect x="84" y="84" width="344" height="344" rx="48" fill="url(#dieGrad)" stroke="#374151" stroke-width="4"/>
  <circle cx="124" cy="124" r="10" fill="#f59e0b"/> <!-- Pin 1 index dot -->

  <!-- Inner Die Heat Spreader -->
  <rect x="136" y="136" width="240" height="240" rx="32" fill="#0c0e14" stroke="#1f2533" stroke-width="4"/>

  <!-- Geometric Silicon Trace Ring -->
  <rect x="156" y="156" width="200" height="200" rx="20" fill="none" stroke="#252c3c" stroke-width="2" stroke-dasharray="12 8"/>

  <!-- Center FriedChip "+" Silicon Emblem -->
  <!-- Vertical Bar -->
  <rect x="236" y="186" width="40" height="140" rx="10" fill="url(#silverTrace)"/>
  <!-- Horizontal Bar -->
  <rect x="186" y="236" width="140" height="40" rx="10" fill="url(#silverTrace)"/>

  <!-- Golden Silicon Core Core-Spot -->
  <rect x="244" y="244" width="24" height="24" rx="4" fill="url(#goldTrace)"/>
</svg>